name: Feature request
description: Suggest a metric, a display style, or a behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to see or do that Common Stats doesn't support?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested approach
      description: For a new metric, say where the data comes from if you know. Common Stats only uses public, unprivileged sources.
