name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: scripts/task check
      - name: Package
        run: |
          # ditto keeps the bundle's signature and extended attributes intact.
          ditto -c -k --keepParent build/StatBar.app "StatBar-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "StatBar-${GITHUB_REF_NAME}.zip" > "StatBar-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "StatBar ${GITHUB_REF_NAME#v}" \
            "StatBar-${GITHUB_REF_NAME}.zip" "StatBar-${GITHUB_REF_NAME}.zip.sha256"
