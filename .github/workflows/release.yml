name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: scripts/task check
      - name: Package
        run: |
          # ditto keeps the bundle's signature and extended attributes intact.
          # The asset name carries no version, so releases/latest/download/CommonStats.zip
          # always points at the newest build.
          ditto -c -k --keepParent "build/Common Stats.app" CommonStats.zip
          shasum -a 256 CommonStats.zip > CommonStats.zip.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Common Stats ${GITHUB_REF_NAME#v}" \
            CommonStats.zip CommonStats.zip.sha256
